name: CI/CD (Laravel)

on:
  push:
    branches:
      - dev

permissions:
  contents: write   

jobs:
  test-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "ci-bot@example.com"

      - name: Merge dev -> main i push
        run: |
          git fetch origin main
          git checkout main
          git merge --no-ff origin/dev -m "chore: auto-merge dev into main (CI)"
          git push origin main